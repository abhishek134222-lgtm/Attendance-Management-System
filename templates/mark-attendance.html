<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mark Attendance</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<canvas id="cursor-canvas"></canvas>

<nav class="navbar">
  <div class="logo">AttendX</div>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/mark-attendance.html" class="active">Mark Attendance</a>
    <a href="/camera-attendance.html">Camera Attendance</a>
    <a href="/students.html">Students</a>
    <a href="/reports.html">Reports</a>
  </div>
  <button class="logout-btn" id="logout-btn">Logout</button>
</nav>

<div class="container">
  <h1 class="page-title">Mark Attendance Manually</h1>
  <p class="page-subtitle">Enter a subject, select a date, and mark students present or absent</p>

  <div class="table-card">
    <div class="table-header">
      <h3>Class List</h3>
      <input type="date" id="attendance-date">
      <input type="text" id="attendance-subject" placeholder="Subject name (e.g. Mathematics)" maxlength="80" required>
    </div>
    <table>
      <thead><tr><th>Roll No</th><th>Name</th><th>Class</th><th>Mark</th></tr></thead>
      <tbody id="mark-table-body"></tbody>
    </table>
    <div class="save-bar">
      <button class="btn-save" id="save-attendance-btn">Save Attendance</button>
    </div>
  </div>
</div>

<script src="/static/script.js"></script>
<script src="/static/mark-attendance.js"></script>
</body>
</html>
