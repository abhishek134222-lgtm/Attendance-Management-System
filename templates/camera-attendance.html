<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Attendance Scanner</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<canvas id="cursor-canvas"></canvas>

<nav class="navbar">
  <div class="logo">AttendX</div>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/mark-attendance.html">Mark Attendance</a>
    <a href="/camera-attendance.html" class="active">Camera Attendance</a>
    <a href="/students.html">Students</a>
    <a href="/reports.html">Reports</a>
  </div>
  <button class="logout-btn" id="logout-btn">Logout</button>
</nav>

<div class="container">
  <h1 class="page-title">Live Attendance Scanner</h1>
  <p class="page-subtitle">Enter a subject, then open the camera. Every registered face in view is marked present automatically.</p>

  <div class="glass-card camera-box">
    <div class="input-group"><input type="text" id="camera-subject" placeholder="Subject name (e.g. Physics)" maxlength="80" required></div>
    <div class="camera-stage">
      <video id="camera-video" autoplay playsinline></video>
      <div class="scan-line" aria-hidden="true"></div>
      <div class="camera-status" id="camera-status"><span></span> Camera offline</div>
    </div>
    <canvas id="camera-canvas" style="display:none;"></canvas>
    <div class="camera-actions">
      <button class="btn-primary" id="start-camera-btn">Start live scan</button>
      <button class="btn-secondary" id="switch-camera-btn" hidden>Switch camera</button>
      <button class="btn-secondary" id="stop-camera-btn" hidden>Stop camera</button>
    </div>
    <div id="result-box" class="result-box" aria-live="polite">The scanner will begin automatically after camera access is granted.</div>
    <div id="recognition-list" class="recognition-list"></div>
  </div>
</div>

<script src="/static/script.js"></script>
<script src="/static/camera.js"></script>
</body>
</html>
